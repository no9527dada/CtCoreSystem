CT3HX=DLC. Fantasy Factory
CT3HX说明=This DLC is a remake of the MOD from version 104. Originally created by Pi Pi, it also served as a base MOD for Creator I.\n\
 Cannot use launch pads in campaign, carry specified resources when starting a map. Cannot use core blueprints when starting a map. Friendly wreckage is retained after failure.\n\
 To reset a map, you must manually abandon it.\n\
 Check for updates and download named: [yellow]ct_fantasy_project
 
 CT3TD=DLC. Tower Defense
CT3TD说明=Tower Defense mode tech tree requires multiple map runs to gather resources for unlocking, encouraging repeated runs of the same map.\n\
 The more you repeat, the easier subsequent maps become.\n\
 The Tower Defense mod is an auxiliary MOD for Creator and cannot be loaded alone.\n\
 Most maps have multiple phase capture settings, depending on map difficulty.\n\
 Research resources are hard to obtain; choose tech research carefully.\n\
 Note: - Accelerating the game may cause bullets to lose damage.\n\
       - Forcing wave skips by other means will increase game difficulty.\n\
 Check for updates and download named: [yellow]cttd

